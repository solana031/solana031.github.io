name: Publish independent ReposNews site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: reposnews-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm approved static content
        run: |
          test -f index.html
          test -f ads.txt
          test -f es/guides/index.html
          test -f en/guides/index.html
          test -f es/repositorios/uv/index.html
          test -f media/reposnews/favicon.svg
      - name: Prepare public artifact
        run: |
          mkdir publish
          tar --exclude=./.git --exclude=./.github --exclude=./publish -cf - . | tar -xf - -C publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: publish
      - id: deployment
        uses: actions/deploy-pages@v4
